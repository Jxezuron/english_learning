{% extends "base.html" %}
{% block title %}Application Error (500) - English Learning Platform{% endblock %}
{% block content %}
<div class="card" style="text-align:center;padding:60px 20px;max-width:600px;margin:40px auto;">
  <div style="font-size:4rem;color:var(--danger);margin-bottom:12px;"><i class="fas fa-exclamation-triangle"></i></div>
  <h1 style="font-size:2.2rem;margin-bottom:12px;">500 - Server Error</h1>
  <p style="color:var(--text-muted);margin-bottom:24px;">An internal error occurred while processing your learning request.</p>
  {% if error %}
    <div style="background:#fee2e2;color:#991b1b;padding:12px;border-radius:6px;font-family:monospace;font-size:0.85rem;margin-bottom:20px;text-align:left;">
      {{ error }}
    </div>
  {% endif %}
  <div>
    <a href="{{ url_for('dashboard.landing') }}" class="btn btn-primary"><i class="fas fa-home"></i> Return Home</a>
  </div>
</div>
{% endblock %}
