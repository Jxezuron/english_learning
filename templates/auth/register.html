{% extends "base.html" %}
{% block title %}Create Account - English Learning Platform{% endblock %}
{% block content %}
<div style="max-width:480px;margin:30px auto;">
  <div class="card" style="padding:32px 28px;">
    <div style="text-align:center;margin-bottom:24px;">
      <div class="brand-icon" style="margin:0 auto 12px auto;width:48px;height:48px;font-size:1.4rem;">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2 style="font-size:1.6rem;color:#0f172a;">Create Student Account</h2>
      <p style="color:var(--text-muted);font-size:0.9rem;">Join the platform to track your learning journey</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required minlength="3">
      </div>

      <div class="form-group">
        <label class="form-label">Email (Optional)</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="form-group" style="margin-bottom:24px;">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat your password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">
        <i class="fas fa-arrow-right"></i> Register & Begin Learning
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:0.9rem;border-top:1px solid #e2e8f0;padding-top:16px;">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight:600;">Sign in here</a><br>
      <div style="margin-top:8px;">
        Or <a href="{{ url_for('auth.guest_login') }}" style="color:var(--secondary);font-weight:600;">continue as guest</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
